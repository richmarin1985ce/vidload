plugins { id 'com.android.application' }
android {
    namespace 'com.vidload.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vidload.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('syncWebAssets', Copy) {
    from(rootDir.toString() + "/../public") {
        include 'index.html', 'app.js', 'styles.css', 'icon.svg', 'manifest.webmanifest'
    }
    into(projectDir.toString() + "/src/main/assets")
}
tasks.named('preBuild').configure { dependsOn tasks.named('syncWebAssets') }
